name: ClusterFuzzLite PR fuzzing

# Fuzzes the parsers that sit on a trust boundary — storage keys, tar
# listings, zstd frame headers, Markdown frontmatter. See fuzz/README.md for
# the property each target asserts.
#
# PR mode runs a short campaign seeded by the corpus from previous runs and
# fails the PR on a new crash, so a traversal or parse regression is caught
# before merge rather than by the weekly batch.

on:
  pull_request:
    branches: [main]
    # Skip when a PR cannot affect the targets. Docs-only and ops-only
    # changes are the common case and a 10-minute fuzz run on them is pure
    # queue time.
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # sanitizer: none — JavaScript has no ASan/UBSan equivalent here, and
      # the OSS-Fuzz builder rejects anything else outright ("JavaScript
      # projects cannot be fuzzed with sanitizers"). Jazzer.js catches
      # uncaught exceptions and our own assertion failures instead, which is
      # what the targets are written against.
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          language: javascript
          sanitizer: none
          # Needed so the action can diff against the base commit and only
          # report crashes the PR introduces.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: none
          output-sarif: true
