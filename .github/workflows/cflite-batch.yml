name: ClusterFuzzLite batch fuzzing

# The long campaign. PR mode only fuzzes code a PR touched for 5 minutes;
# this runs every target for an hour weekly and grows the shared corpus that
# seeds those PR runs, so coverage compounds instead of restarting cold.
#
# Sunday 04:00 UTC — before the 06:00 snapshot build, so the two don't
# contend for runners.

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  batch-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          language: javascript
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: 'batch'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
