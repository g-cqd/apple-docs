name: CodeQL

# A17: GitHub-hosted SAST. Runs on every PR + push to main, plus a
# weekly cron so a newly-published advisory against an already-merged
# pattern surfaces without a code change.
#
# JS/TS only, deliberately. The matrix used to carry a `swift` leg; Swift is
# a compiled language for CodeQL, so that job had to build the package, and
# the only Swift on main is the RFC-0001 experiment under
# rfcs/0001-swift-native-transition/p0/experiments/swift. Building it blew
# past the 1-hour job cap and was cancelled (run 30183479244), failing the
# workflow on every push while analysing nothing that ships.
#
# Re-add a swift leg only with a bounded build of real shipped Swift. The
# Swift this project actually runs lives as template strings in
# src/resources/swift-templates.js and is executed with `swift <script>` —
# CodeQL cannot analyse it as source either way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC — off-peak, off-hour to avoid coalescing with
    # weekday spikes.
    - cron: '17 6 * * 1'

# Read-only by default; the analyze job elevates only what it needs.
# Scorecard's Token-Permissions check flags workflow-level write scopes
# because every job in the file inherits them.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # SARIF upload needs security-events: write; the init/autobuild steps
      # read workflow metadata via actions: read.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is the recommended baseline; the
          # `security-extended` suite adds extra precision-3 queries.
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: '/language:${{ matrix.language }}'
