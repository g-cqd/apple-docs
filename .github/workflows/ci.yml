name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 05:30 UTC — before Dependabot's 06:00/06:30 runs, so
    # a fresh advisory shows up as a red `audit` job on main the same
    # morning the fix PR arrives.
    - cron: '30 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Dependabot bumps package.json but does not regenerate bun.lock, so a
  # frozen install can never pass on its branches. Relax it there only;
  # every human branch and main still get the frozen guarantee.
  FROZEN_LOCKFILE: ${{ github.actor != 'dependabot[bot]' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # Every job gets a timeout. Without one a hung step runs to GitHub's
    # 6-hour default while holding the `ci-<ref>` concurrency group, so every
    # later push queues behind it and the branch silently stops being tested.
    # Observed: `bun test --coverage --isolate` wedged on ubuntu for over an
    # hour and stalled three subsequent runs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frozen-lockfile: ${{ env.FROZEN_LOCKFILE }}

      - name: Lint (Biome)
        run: bun run lint

      - name: Lint web assets (Biome)
        run: bun run lint:web

      - name: Type check
        run: bun run typecheck

      - name: Unused code (Knip)
        run: bun run lint:unused

      - name: Code duplication (jscpd)
        run: |
          mkdir -p reports
          bun run lint:duplication

      - name: File-size budget
        run: bun run lint:size

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: reports/
          retention-days: 30

  # Dependency audit lives in its own job and only runs against main
  # (push / schedule / dispatch), never on pull requests. Inside `quality`
  # it made CI time-dependent: the moment an advisory was published, every
  # commit failed regardless of what it changed (2026-09-18 runner-image
  # commit), and every PR branch behind main stayed red until rebased
  # (Dependabot #22, #23). A new advisory is still surfaced — as a red
  # `audit` job on main, which is where the override bump lands anyway.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Dependency audit
        run: bun audit

  test:
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 (macOS 27.0 / Xcode 27.0 — the newest image GitHub hosts,
        # preview label; see snapshot.yml for the rationale + the GA
        # migration note) carries the latest CoreGlyphs / CoreGlyphsPrivate
        # bundles so private-symbol code paths (renderSfSymbol,
        # prerenderSfSymbols, symbol-pdf-to-svg) get exercised against the
        # same Swift toolchain the snapshot workflow uses.
        os: [ubuntu-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    # Normal run is ~1 min on ubuntu and ~1.5 min on macOS; 20 leaves room
    # for a cold cache without letting a wedged run hold the group.
    timeout-minutes: 20
    env:
      APPLE_DOCS_NO_GIT_AUTH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frozen-lockfile: ${{ env.FROZEN_LOCKFILE }}

      - name: Run tests with coverage
        run: bun test --coverage --isolate

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 30

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  # Mutation testing was removed in June 2026: the nightly Stryker run
  # had not produced a single green report in over two weeks (ten ~1-min
  # config failures, then 5h-timeout kills once it started mutating —
  # the full-corpus pass simply doesn't fit any sane runner budget),
  # while burning ~5 runner-hours a day. Correctness is gated by the
  # unit + coverage runs above; if mutation ever returns it needs a
  # sharded or diff-scoped design, not a bigger timeout.
