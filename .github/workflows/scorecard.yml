name: Scorecard supply-chain security

# A17: OpenSSF Scorecard reports on the project's supply-chain hygiene
# (branch protection, signed releases, dependency-update tooling, ...).
# Runs weekly + on push to main; results upload to GitHub's code-scanning
# UI and to OpenSSF's public dashboard via `publish_results`.

on:
  push:
    branches: [main]
  schedule:
    # Tuesdays 06:31 UTC.
    - cron: '31 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        # `@v2` is not a resolvable ref on this action; the publisher
        # only ships specific minor tags. Pin the current minor SHA so
        # the workflow is reproducible and not subject to tag movement.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
