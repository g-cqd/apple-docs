name: Setup
description: Install Bun, cache dependencies, and run frozen install. Requires actions/checkout to have run first.

inputs:
  frozen-lockfile:
    description: >-
      Pass --frozen-lockfile to `bun install`. Set to 'false' for
      Dependabot branches: Dependabot bumps package.json but does not
      regenerate bun.lock, so every one of its PRs failed at install with
      "lockfile had changes, but lockfile is frozen" (observed on #23).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Cache Bun install artifacts
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      env:
        FROZEN: ${{ inputs.frozen-lockfile }}
      run: |
        if [ "$FROZEN" = "false" ]; then
          echo "::notice::installing without --frozen-lockfile (Dependabot branch); bun.lock must be regenerated before merge"
          bun install
        else
          bun install --frozen-lockfile
        fi
