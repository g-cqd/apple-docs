# SwiftLint configuration for apple-docs (Swift): canonical g-cqd metrics + strict safety rules.
#
# swift-format (.swift-format) owns all formatting and style. SwiftLint enforces size/complexity
# metrics and safety bans (no force unwrap/try/cast, no IUO, no message-less fatalError,
# no unowned captures). Structure rules (one non-private top-level type per file, <= 250 lines)
# are enforced by SourceStructureTests inside `swift test`.

only_rules:
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - function_parameter_count
  - nesting
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture

excluded:
  - .build
  - .build-release
  - "**/.build/**"
  - .git
  - Benchmarks
  - Fuzz
  - Plugins
  - "**/Generated/**"

file_length:
  warning: 300
  error: 500
  ignore_comment_only_lines: true

type_body_length:
  warning: 200
  error: 400

function_body_length:
  warning: 60
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15
  ignores_case_statements: true

large_tuple:
  warning: 3
  error: 4

function_parameter_count:
  warning: 6
  error: 8

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5
